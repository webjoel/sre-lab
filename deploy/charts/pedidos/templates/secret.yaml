# PROBLEMA INTENCIONAL: Secret do Kubernetes é apenas base64, NÃO é criptografia.
# Qualquer um com acesso de leitura ao namespace lê a senha. Fase 4 substitui por
# Vault + External Secrets Operator, e a senha sai do Git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credenciais
  labels: {{- include "pedidos.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.password | quote }}
