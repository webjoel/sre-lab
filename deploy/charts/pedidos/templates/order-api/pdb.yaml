{{- if gt (int .Values.orderApi.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-order-api
  labels: {{- include "pedidos.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "pedidos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: order-api
{{- end }}
