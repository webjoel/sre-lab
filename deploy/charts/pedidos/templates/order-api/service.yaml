apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-order-api
  labels: {{- include "pedidos.labels" . | nindent 4 }}
    app.kubernetes.io/component: order-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector: {{- include "pedidos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: order-api
