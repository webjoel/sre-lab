# ServiceAccount própria por aplicação, sem permissão nenhuma na API do Kubernetes.
# As aplicações não falam com a API, então o acesso correto é NENHUM (menor privilégio).
# automountServiceAccountToken: false evita montar um token que ninguém usa — token montado
# é material para escalada de privilégio se o container for comprometido.
{{- range $app := list "order-api" "payment-worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $app }}
  labels: {{- include "pedidos.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
# Role de leitura para uso humano em troubleshooting (exercício da fase):
# quem recebe este papel lê pods e logs, mas não altera nada.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-leitura
  labels: {{- include "pedidos.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
