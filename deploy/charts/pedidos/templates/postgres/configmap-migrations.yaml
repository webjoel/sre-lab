# ATENÇÃO: o Helm só lê arquivos de dentro do chart, então files/001_orders.sql é uma
# CÓPIA de apps/order-api/migrations/001_orders.sql. As duas precisam ser mantidas iguais;
# o job "schema" do CI falha se divergirem.
# Rodar migration via initdb só funciona no primeiro boot: a partir da Fase 5
# isso vira um Job/initContainer com ferramenta de migration de verdade.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-migrations
  labels: {{- include "pedidos.labels" . | nindent 4 }}
data:
  001_orders.sql: |
{{ .Files.Get "files/001_orders.sql" | indent 4 }}
