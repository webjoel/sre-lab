name: pr-checks

on:
  pull_request:
  push:
    branches: [main]
  # CVE nova aparece em código que não mudou: a checagem precisa rodar no tempo,
  # não só no commit. Segunda-feira, 6h UTC.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks precisa do histórico

      - uses: hashicorp/setup-terraform@v3

      - uses: terraform-linters/setup-tflint@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  # Templates do Helm são excluídos do check-yaml do pre-commit (não são YAML válido
  # antes de renderizados). Este job é quem os valida de fato.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint deploy/charts/pedidos

      - name: Renderiza e valida o YAML gerado
        run: |
          helm template pedidos deploy/charts/pedidos \
            --namespace pedidos > /tmp/render.yaml
          python -c "import yaml,sys; list(yaml.safe_load_all(open('/tmp/render.yaml'))); print('YAML renderizado OK')"

      # kubeconform valida o YAML renderizado contra o schema real das APIs do Kubernetes:
      # pega campo inexistente, apiVersion errada, tipo trocado — coisas que o helm lint não vê.
      - name: Valida contra o schema do Kubernetes
        run: |
          KUBECONFORM_VERSION=v0.7.0
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.35.0 /tmp/render.yaml

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/order-api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/order-api/go.mod
          cache-dependency-path: apps/order-api/go.sum

      # go vet encontra erros que compilam mas estão errados (printf com argumento
      # trocado, lock copiado por valor, etc.)
      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o /dev/null ./...

      # govulncheck é o scanner oficial do Go e faz análise de alcançabilidade: só reporta
      # vulnerabilidade em função que o código realmente chama. Bem menos falso positivo que
      # scanners que olham apenas o go.sum (Trivy, Dependabot) — e complementar a eles.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      # Falha se go.mod/go.sum estiverem desatualizados em relação aos imports.
      - name: go.mod está sincronizado?
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
